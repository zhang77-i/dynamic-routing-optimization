[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lade-dynamic-routing"
version = "0.1.0"
description = "Dynamic last-mile routing on the Cainiao LaDe dataset"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
